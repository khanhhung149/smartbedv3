# Mosquitto config cho hệ thống presence + AC (MVP LAN nội bộ)
# Không dùng TLS ở MVP — chấp nhận được trong LAN. Nếu mở ra internet PHẢI thêm TLS.

listener 1883

# Bắt buộc auth — chặn anonymous connect trên LAN
allow_anonymous false
password_file /mosquitto/config/passwd

# Lưu message retain qua restart broker (presence retain=true cần cái này)
persistence true
persistence_location /mosquitto/data/

# Log ra stdout để `docker logs` xem được
log_dest stdout
log_type warning
log_type notice
log_type information
