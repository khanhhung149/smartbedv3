# Mosquitto broker cho hệ thống presence + AC.
# Chạy:  docker compose up -d
# Tạo user (lần đầu, xem README) trước khi start, nếu không broker sẽ từ chối mọi connect.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: home-mqtt
    # Tự restart khi crash / khi máy reboot -> đáp ứng success criteria "restart tự động"
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:
