# Mosquitto broker cho hệ thống presence + AC.
# Chạy:  docker compose up -d
# Tạo user (lần đầu, xem README) trước khi start, nếu không broker sẽ từ chối mọi connect.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: home-mqtt
    # Tự restart khi crash / khi máy reboot -> đáp ứng success criteria "restart tự động"
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:

# Network có TÊN CỐ ĐỊNH để stack backend (cloud/presence-ac) nối vào được.
# Trước đây backend trỏ broker qua host.docker.internal. Đo 20/08: trên Docker Desktop đường đó
# KHÔNG tới nơi — proxy cổng accept rồi treo ở SYN_SENT, nên `nc`/`netstat` vẫn báo cổng mở trong
# khi broker không hề nhận được kết nối nào. Container gọi nhau thẳng qua network chung thì không
# đi qua proxy đó, và cũng không phụ thuộc IP máy host.
networks:
  default:
    name: smartbed-mqtt
