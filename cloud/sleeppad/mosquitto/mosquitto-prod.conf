# Mosquitto — Production (VPS + cloudflared tunnel)
# WebSocket 9001 only — cloudflared terminates TLS at 443 and proxies to 9001
# Auth required via password file + topic ACL via %c pattern

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
log_type notice

# Shared auth + ACL for both listeners
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl
allow_anonymous false

# WebSocket listener (cloudflared proxies mqtt.{DOMAIN} :443 → here :9001)
listener 9001
protocol websockets

# Internal TCP listener for FastAPI subscriber (container network only, not exposed)
listener 1883
protocol mqtt
