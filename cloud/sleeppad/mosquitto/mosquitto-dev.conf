# Mosquitto — Development (local LAN)
# TCP 1883 for ESP32 on LAN + WebSocket 9001 for browser testing
# No auth — trusted LAN only

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
log_type notice

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
