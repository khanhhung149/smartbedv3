server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SvelteKit adapter-static emits flat `<lang>.html`; let `/ja` resolve to `ja.html`.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  # Long cache for hashed asset chunks
  location /_app/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Generated AI assets (Imagen + Veo3) — long cache, content-addressed by filename.
  location /generated/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Compress text responses
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
