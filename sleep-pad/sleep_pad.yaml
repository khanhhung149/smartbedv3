uart:
  id: uart_sleep_pad
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      delimiter: [0x0D]
    sequence:
      # - lambda: UARTDebug::log_hex(direction, bytes, ',')
      - lambda: |-
          std::string hex_str = format_hex_pretty(bytes);
          ESP_LOGI("SleepPad", "Received HEX: %s", hex_str.c_str());
          if (bytes.front() != 0x7D || bytes.back() != 0x0D) {
            ESP_LOGW("SleepPad", "Invalid frame: does not start with 0x7D or end with 0x0D");
            return;
          }
          uint8_t frame_type = bytes[1];
          // return if frame type is not 0x85
          if (frame_type != 0x85) {
            ESP_LOGW("SleepPad", "Invalid frame type: expected 0x85, got 0x%02X", frame_type);
            return;
          }
          // Extract frame length (next 2 bytes)
          uint16_t frame_length = (bytes[2] | (bytes[3] << 8));
          ESP_LOGI("SleepPad", "Frame Length: %d", frame_length);
          // Extract ID (10 bytes)
          std::string id(reinterpret_cast<char*>(&bytes[4]), 10);
          ESP_LOGI("SleepPad", "ID: %s", id.c_str());
          // Extract content
          std::vector<uint8_t> content(bytes.begin() + 14, bytes.end() - 1);
          if (content.size() != 12) {
            ESP_LOGW("SleepPad", "Invalid content length for 0x85 command");
            return;
          }
          // Decode fields
          uint8_t serial_number = content[0];
          uint32_t timestamp = content[1] | (content[2] << 8) | (content[3] << 16) | (content[4] << 24);
          uint8_t status_code = content[5];
          uint8_t heart_rate = content[6];
          float respiration_rate = content[7] / 10.0;
          uint16_t sdata = content[8] | (content[9] << 8);
          uint16_t pdata = content[10] | (content[11] << 8);

          // Map status code to status string
          const char* status_text = "UNKNOWN";
          switch (status_code) {
            case 0x01: status_text = "GET_OUT_OF_BED"; break;
            case 0x02: status_text = "SPLIT_MOVEMENT"; break;
            case 0x03: status_text = "SIT_UP"; break;
            case 0x04: status_text = "SLEEP"; break;
            case 0x05: status_text = "WAKE_UP"; break;
            case 0x06: status_text = "HEAVY_OBJECT"; break;
            case 0x07: status_text = "SNORE"; break;
            case 0x08: status_text = "WEAK_BREATHING"; break;
          }

          // Log parsed values
          ESP_LOGI("SleepPad", "Frame 0x85 Parsed Data:");
          ESP_LOGI("SleepPad", "  Serial Number: %d", serial_number);
          ESP_LOGI("SleepPad", "  Timestamp: %u", timestamp);
          ESP_LOGI("SleepPad", "  Status: %s", status_text);
          ESP_LOGI("SleepPad", "  Heart Rate: %d", heart_rate);
          ESP_LOGI("SleepPad", "  Respiration Rate: %.1f", respiration_rate);
          ESP_LOGI("SleepPad", "  SData: %d", sdata);
          ESP_LOGI("SleepPad", "  PData: %d", pdata);
          id(sleep_pad_status).publish_state(status_text);
          id(sleep_pad_heart_rate).publish_state(heart_rate);
          id(sleep_pad_respiration_rate).publish_state(respiration_rate);

text_sensor:
  - platform: template
    id: sleep_pad_status
    name: "SleepPad Status"
    update_interval: never

sensor:
  - platform: template
    id: sleep_pad_heart_rate
    name: "SleepPad Heart Rate"
    unit_of_measurement: "bpm"
    update_interval: never

  - platform: template
    id: sleep_pad_respiration_rate
    name: "SleepPad Respiration Rate"
    unit_of_measurement: "bpm"
    update_interval: never
