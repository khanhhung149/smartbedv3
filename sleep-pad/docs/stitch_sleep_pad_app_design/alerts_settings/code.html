<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0F14; }
        
        /* Custom range slider styling for cross-browser consistency */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -10px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 2px solid #101419;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Dual range logic requires slightly complex CSS or JS, simplifying for static mockup with overlapping absolute sliders or visual representation */
        .slider-track {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            position: relative;
        }
        .slider-fill-teal {
            position: absolute;
            height: 100%;
            background: #5EE7DF;
            border-radius: 2px;
        }
        .slider-fill-lavender {
            position: absolute;
            height: 100%;
            background: #B490F5;
            border-radius: 2px;
        }
        .slider-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #101419;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .thumb-teal { background: #5EE7DF; }
        .thumb-lavender { background: #B490F5; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="text-on-background antialiased pb-32">
