<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sleep Pad - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#4fdad3",
                        "primary": "#a4fff8",
                        "on-tertiary-fixed": "#261900",
                        "on-secondary-fixed-variant": "#553291",
                        "on-tertiary-container": "#765500",
                        "surface-container-low": "#181c21",
                        "on-primary-fixed-variant": "#00504c",
                        "surface-dim": "#101419",
                        "error": "#ffb4ab",
                        "surface-container": "#1c2025",
                        "on-surface": "#e0e2ea",
                        "on-secondary-container": "#c5a5ff",
                        "on-background": "#e0e2ea",
                        "inverse-surface": "#e0e2ea",
                        "on-primary-fixed": "#00201e",
                        "on-secondary-fixed": "#260058",
                        "primary-fixed-dim": "#4fdad3",
                        "tertiary": "#ffedd1",
                        "surface-container-highest": "#31353b",
                        "on-error-container": "#ffdad6",
                        "surface": "#101419",
                        "on-surface-variant": "#bbc9c7",
                        "tertiary-fixed-dim": "#f2bf59",
                        "tertiary-fixed": "#ffdea5",
                        "surface-container-high": "#262a30",
                        "secondary-fixed-dim": "#d4bbff",
                        "on-secondary": "#3e1779",
                        "inverse-primary": "#006a66",
                        "inverse-on-surface": "#2d3136",
                        "secondary-fixed": "#ebdcff",
                        "secondary": "#d4bbff",
                        "error-container": "#93000a",
                        "surface-variant": "#31353b",
                        "on-tertiary-fixed-variant": "#5d4200",
                        "on-error": "#690005",
                        "on-primary-container": "#006661",
                        "tertiary-container": "#ffcb64",
                        "surface-bright": "#36393f",
                        "surface-container-lowest": "#0a0e13",
                        "outline": "#859492",
                        "primary-fixed": "#70f7ef",
                        "background": "#101419",
                        "on-tertiary": "#412d00",
                        "secondary-container": "#553291",
                        "outline-variant": "#3c4948",
                        "primary-container": "#5ee7df",
                        "on-primary": "#003734"
                    },
                    "borderRadius": {
                        "DEFAULT": "1.25rem", /* Adjusted slightly to approximate 20px using standard sizing logic without arbitrary classes where possible */
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-primary/30 selection:text-primary-container">
<!-- Main Container -->
<main class="w-full max-w-sm flex flex-col items-center">
<!-- Branding Area -->
<div class="flex flex-col items-center mb-16 mt-8">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">monitoring</span>
<h1 class="text-[28px] font-bold tracking-tight">Sleep Pad</h1>
</div>
</div>
<!-- Greeting -->
<div class="w-full mb-10 pl-2">
<h2 class="text-3xl font-medium tracking-tight text-on-surface">Welcome back</h2>
</div>
<!-- Form Area -->
<form class="w-full flex flex-col gap-5">
<!-- Email Field -->
<div class="w-full relative">
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline border-none rounded py-[14px] px-5 focus:ring-1 focus:ring-primary/40 focus:outline-none transition-all" placeholder="Email address" type="email"/>
</div>
<!-- Password Field -->
<div class="w-full relative">
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline border-none rounded py-[14px] pl-5 pr-12 focus:ring-1 focus:ring-primary/40 focus:outline-none transition-all" placeholder="Password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Primary Action -->
<button class="w-full mt-4 bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-semibold py-[14px] rounded-full active:scale-[0.98] transition-transform duration-200 shadow-[0_0_40px_rgba(164,255,248,0.15)] hover:shadow-[0_0_50px_rgba(164,255,248,0.25)]" type="button">
                Sign in
            </button>
</form>
<!-- Secondary Actions -->
<div class="w-full mt-8 flex flex-col items-center gap-6">
<a class="text-secondary hover:text-primary transition-colors text-sm font-medium" href="#">
                New here? Sign up
            </a>
</div>
</main>
<!-- Footer Action -->
<div class="mt-auto pb-8 pt-12">
<a class="text-outline hover:text-on-surface-variant transition-colors text-sm" href="#">
            Forgot password?
        </a>
</div>
</body></html>
