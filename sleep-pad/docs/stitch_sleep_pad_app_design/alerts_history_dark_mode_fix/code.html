<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Alerts History</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-variant": "#31353b",
                      "tertiary-container": "#ffcb64",
                      "surface-container-highest": "#31353b",
                      "on-background": "#e6edf3",
                      "tertiary-fixed-dim": "#f2bf59",
                      "on-primary-container": "#006661",
                      "on-tertiary-fixed-variant": "#5d4200",
                      "secondary-fixed-dim": "#d4bbff",
                      "primary": "#a4fff8",
                      "on-error-container": "#ffdad6",
                      "inverse-surface": "#e0e2ea",
                      "surface-container-low": "#121821",
                      "error-container": "#93000a",
                      "surface-container-lowest": "#0a0e13",
                      "error": "#ffb4ab",
                      "surface": "#101419",
                      "on-secondary-container": "#c5a5ff",
                      "primary-fixed": "#70f7ef",
                      "secondary": "#d4bbff",
                      "primary-container": "#5ee7df",
                      "inverse-on-surface": "#2d3136",
                      "on-tertiary-fixed": "#261900",
                      "outline": "#859492",
                      "on-primary": "#003734",
                      "surface-dim": "#101419",
                      "on-secondary": "#3e1779",
                      "on-error": "#690005",
                      "on-tertiary": "#412d00",
                      "on-secondary-fixed-variant": "#553291",
                      "on-primary-fixed": "#00201e",
                      "background": "#0b0f14",
                      "on-surface-variant": "#bbc9c7",
                      "surface-container-high": "#262a30",
                      "secondary-container": "#553291",
                      "tertiary": "#ffedd1",
                      "on-secondary-fixed": "#260058",
                      "outline-variant": "#3c4948",
                      "on-surface": "#e6edf3",
                      "surface-container": "#1c2025",
                      "on-primary-fixed-variant": "#00504c",
                      "inverse-primary": "#006a66",
                      "surface-tint": "#4fdad3",
                      "secondary-fixed": "#ebdcff",
                      "on-tertiary-container": "#765500",
                      "surface-bright": "#36393f",
                      "tertiary-fixed": "#ffdea5",
                      "primary-fixed-dim": "#4fdad3"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Inter"
                      ],
                      "body": [
                              "Inter"
                      ],
                      "label": [
                              "Inter"
                      ]
              }
      },
          },
        }
      </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f14;
            color: #e6edf3;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col pt-16 pb-24 md:pb-0 overflow-x-hidden bg-[#0B0F14] text-[#E6EDF3]">
<!-- TopAppBar -->
<header class="bg-[#101419]/70 backdrop-blur-2xl font-['Inter'] font-semibold tracking-tight shadow-[0_10px_40px_0_rgba(230,237,243,0.06)] flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50">
<button class="text-[#8B96A5] hover:text-[#5EE7DF] transition-colors scale-95 active:scale-90 transition-transform flex items-center justify-center p-2">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-lg font-bold text-[#E6EDF3]">Alerts</h1>
<button class="text-[#8B96A5] hover:text-[#5EE7DF] transition-colors scale-95 active:scale-90 transition-transform flex items-center justify-center p-2">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-6 pt-6 max-w-3xl mx-auto w-full">
<!-- Segmented Control -->
<div class="flex p-1 bg-[#0A0E13] rounded-full mb-8 relative">
<button class="flex-1 py-2 px-4 rounded-full text-sm font-medium text-[#8B96A5] transition-colors hover:text-[#E6EDF3] z-10 relative">
                Active
            </button>
<button class="flex-1 py-2 px-4 rounded-full text-sm font-medium text-[#5EE7DF] bg-[#262A30] transition-colors z-10 relative shadow-[0_0_15px_rgba(0,0,0,0.2)]">
                History
            </button>
</div>
<!-- History List -->
<div class="space-y-6">
<!-- Alert Item 1 -->
<div class="bg-[#121821] rounded-[20px] p-5 flex items-start gap-4">
<div class="mt-1 flex-shrink-0">
<div class="w-3 h-3 rounded-full bg-error shadow-[0_0_10px_rgba(255,180,171,0.3)]"></div>
</div>
<div class="flex-grow">
<h3 class="text-[#E6EDF3] font-semibold mb-1">Heart Rate high</h3>
<p class="text-sm text-[#8B96A5]">131 bpm <span class="text-outline mx-1">•</span> limit 120</p>
</div>
<div class="flex-shrink-0 text-xs text-outline font-medium">
                    2h ago
                </div>
</div>
<!-- Alert Item 2 -->
<div class="bg-[#121821] rounded-[20px] p-5 flex items-start gap-4">
<div class="mt-1 flex-shrink-0">
<div class="w-3 h-3 rounded-full bg-tertiary-fixed shadow-[0_0_10px_rgba(255,222,165,0.3)]"></div>
</div>
<div class="flex-grow">
<h3 class="text-[#E6EDF3] font-semibold mb-1">Respiration Rate low</h3>
<p class="text-sm text-[#8B96A5]">4 brpm <span class="text-outline mx-1">•</span> limit 5</p>
</div>
<div class="flex-shrink-0 text-xs text-outline font-medium">
                    5h ago
                </div>
</div>
<!-- Alert Item 3 -->
<div class="bg-[#121821] rounded-[20px] p-5 flex items-start gap-4 opacity-70">
<div class="mt-1 flex-shrink-0">
<div class="w-3 h-3 rounded-full bg-error-container shadow-[0_0_10px_rgba(147,0,10,0.3)]"></div>
</div>
<div class="flex-grow">
<h3 class="text-[#E6EDF3] font-semibold mb-1">Movement Disturbance</h3>
<p class="text-sm text-[#8B96A5]">High activity detected</p>
</div>
<div class="flex-shrink-0 text-xs text-outline font-medium">
                    Yesterday
                </div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile) -->
<nav class="md:hidden bg-[#101419]/70 backdrop-blur-3xl font-['Inter'] text-[10px] font-medium tracking-wide fixed bottom-0 w-full rounded-t-[32px] shadow-[0_-10px_40px_0_rgba(0,0,0,0.4)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3">
<a class="flex flex-col items-center justify-center text-[#8B96A5] hover:bg-white/5 scale-98 active:scale-95 transition-all duration-200 p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span>Home</span>
</a>
<a class="flex flex-col items-center justify-center text-[#8B96A5] hover:bg-white/5 scale-98 active:scale-95 transition-all duration-200 p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span>History</span>
</a>
<a class="flex flex-col items-center justify-center text-[#5EE7DF] bg-[#5EE7DF]/10 rounded-full px-4 py-1 scale-98 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="notification_important" style="font-variation-settings: 'FILL' 1;">notification_important</span>
<span>Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-[#8B96A5] hover:bg-white/5 scale-98 active:scale-95 transition-all duration-200 p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="devices">devices</span>
<span>Devices</span>
</a>
<a class="flex flex-col items-center justify-center text-[#8B96A5] hover:bg-white/5 scale-98 active:scale-95 transition-all duration-200 p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span>Settings</span>
</a>
</nav>
</body></html>
