<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F14;
            color: theme('colors.on-background');
        }
    </style>
<style>
    body {

<body class="bg-[#0B0F14] antialiased min-h-screen flex flex-col items-center justify-start overflow-x-hidden pt-16 pb-24">
<!-- Top Navigation (Transactional intent, simple app bar) -->
<header class="fixed top-0 w-full z-50 h-16 bg-[#0B0F14]/70 backdrop-blur-2xl bg-gradient-to-b from-[#0B0F14] to-transparent shadow-[0_4px_40px_rgba(230,237,243,0.06)] flex justify-between items-center px-6 max-w-screen-xl mx-auto">
<div class="flex items-center gap-3">
<button class="text-[#8B96A5] hover:text-[#a4fff8] transition-colors active:scale-[0.98] transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-[#E6EDF3] font-bold text-lg font-['Inter'] tracking-tight">Setup Sleep Pad</h1>
</div>
<div class="text-[#5EE7DF] font-['Inter'] font-semibold tracking-tight text-sm">
            3 of 3
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md px-6 pt-12 flex flex-col items-center justify-center relative">
<!-- Background Glow -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-64 h-64 bg-primary-container/10 rounded-full blur-3xl -z-10 pointer-events-none"></div>
<!-- Success Hero Graphic -->
<div class="mb-12 relative flex items-center justify-center">
<div class="w-[120px] h-[120px] rounded-full bg-surface-container-highest flex items-center justify-center shadow-[0_20px_40px_rgba(0,0,0,0.5)] border border-outline-variant/15 relative z-10">
<div class="w-[100px] h-[100px] rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center shadow-[0_0_30px_rgba(94,231,223,0.3)]">
<span class="material-symbols-outlined text-[64px] text-on-primary-fixed" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Ripples -->
<div class="absolute w-[160px] h-[160px] rounded-full border border-primary/20 animate-[ping_3s_ease-out_infinite] z-0"></div>
<div class="absolute w-[200px] h-[200px] rounded-full border border-primary/10 animate-[ping_3s_ease-out_infinite_1s] z-0"></div>
</div>
<!-- Typography Block -->
<div class="text-center space-y-4 mb-16 w-full">
<h2 class="text-4xl font-headline font-bold text-primary tracking-tight">Sleep Pad is ready</h2>
<div class="inline-flex items-center gap-2 bg-surface-container-lowest px-4 py-2 rounded-full border border-outline-variant/15 shadow-[0_4px_20px_rgba(0,0,0,0.4)]">
<span class="material-symbols-outlined text-primary-container text-sm" style="font-variation-settings: 'FILL' 1;">blur_on</span>
<p class="text-sm font-label text-on-surface-variant font-medium">Device ID: CNU2000001 <span class="mx-1 text-outline">·</span> <span class="text-primary-fixed-dim">Connected</span></p>
</div>
</div>
<!-- Input Section -->
<div class="w-full space-y-3 mb-12">
<label class="block text-sm font-medium text-on-surface-variant ml-2" for="deviceName">Give it a name</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-0 rounded-lg py-4 px-5 text-on-surface font-body text-lg shadow-[inset_0_2px_10px_rgba(0,0,0,0.5)] focus:ring-1 focus:ring-primary/40 focus:outline-none transition-all placeholder:text-outline-variant" id="deviceName" placeholder="e.g., Master Bedroom" type="text" value="Grandma's room"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant">edit</span>
</div>
</div>
</main>
<!-- Bottom Fixed Action -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-[#0B0F14] via-[#0B0F14]/90 to-transparent z-40 pb-12">
<button class="w-full max-w-md mx-auto block bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-semibold py-4 rounded-full shadow-[0_8px_30px_rgba(94,231,223,0.25)] hover:shadow-[0_8px_40px_rgba(94,231,223,0.4)] active:scale-[0.98] transition-all duration-200 text-lg flex justify-center items-center gap-2 border border-primary/20">
            Save and go home
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
