<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sleep Pad - Register</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-tint": "#4fdad3",
                        "primary": "#a4fff8",
                        "on-tertiary-fixed": "#261900",
                        "on-secondary-fixed-variant": "#553291",
                        "on-tertiary-container": "#765500",
                        "surface-container-low": "#181c21",
                        "on-primary-fixed-variant": "#00504c",
                        "surface-dim": "#101419",
                        "error": "#ffb4ab",
                        "surface-container": "#1c2025",
                        "on-surface": "#e0e2ea",
                        "on-secondary-container": "#c5a5ff",
                        "on-background": "#e0e2ea",
                        "inverse-surface": "#e0e2ea",
                        "on-primary-fixed": "#00201e",
                        "on-secondary-fixed": "#260058",
                        "primary-fixed-dim": "#4fdad3",
                        "tertiary": "#ffedd1",
                        "surface-container-highest": "#31353b",
                        "on-error-container": "#ffdad6",
                        "surface": "#101419",
                        "on-surface-variant": "#bbc9c7",
                        "tertiary-fixed-dim": "#f2bf59",
                        "tertiary-fixed": "#ffdea5",
                        "surface-container-high": "#262a30",
                        "secondary-fixed-dim": "#d4bbff",
                        "on-secondary": "#3e1779",
                        "inverse-primary": "#006a66",
                        "inverse-on-surface": "#2d3136",
                        "secondary-fixed": "#ebdcff",
                        "secondary": "#d4bbff",
                        "error-container": "#93000a",
                        "surface-variant": "#31353b",
                        "on-tertiary-fixed-variant": "#5d4200",
                        "on-error": "#690005",
                        "on-primary-container": "#006661",
                        "tertiary-container": "#ffcb64",
                        "surface-bright": "#36393f",
                        "surface-container-lowest": "#0a0e13",
                        "outline": "#859492",
                        "primary-fixed": "#70f7ef",
                        "background": "#101419",
                        "on-tertiary": "#412d00",
                        "secondary-container": "#553291",
                        "outline-variant": "#3c4948",
                        "primary-container": "#5ee7df",
                        "on-primary": "#003734"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-primary-container selection:text-on-primary-fixed">
<main class="w-full max-w-[360px] flex flex-col gap-12">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-4">
<div class="flex items-center justify-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary-container text-2xl" style="font-variation-settings: 'wght' 600;">vital_signs</span>
<h1 class="text-[28px] font-bold tracking-tight text-primary-container">Sleep Pad</h1>
</div>
<h2 class="text-2xl font-semibold tracking-tight text-on-surface">Create your account</h2>
</header>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-5" method="POST">
<!-- Email Field -->
<div class="relative flex flex-col">
<label class="sr-only" for="email">Email address</label>
<input class="h-[52px] w-full bg-surface-container text-on-surface placeholder:text-on-surface-variant/60 rounded-[20px] px-5 py-3 border-transparent focus:border-transparent focus:ring-1 focus:ring-primary/40 transition-all shadow-sm outline-none text-base" id="email" name="email" placeholder="Email address" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="relative flex flex-col">
<label class="sr-only" for="password">Password</label>
<input class="h-[52px] w-full bg-surface-container text-on-surface placeholder:text-on-surface-variant/60 rounded-[20px] pl-5 pr-12 py-3 border-transparent focus:border-transparent focus:ring-1 focus:ring-primary/40 transition-all shadow-sm outline-none text-base" id="password" name="password" placeholder="Password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none flex items-center justify-center h-8 w-8 rounded-full" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Confirm Password Field -->
<div class="relative flex flex-col">
<label class="sr-only" for="confirm-password">Confirm password</label>
<input class="h-[52px] w-full bg-surface-container text-on-surface placeholder:text-on-surface-variant/60 rounded-[20px] pl-5 pr-12 py-3 border-transparent focus:border-transparent focus:ring-1 focus:ring-primary/40 transition-all shadow-sm outline-none text-base" id="confirm-password" name="confirm-password" placeholder="Confirm password" required="" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none flex items-center justify-center h-8 w-8 rounded-full" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Spacer -->
<div class="h-2"></div>
<!-- Primary Action -->
<button class="w-full h-[52px] rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-semibold text-base shadow-[0_4px_24px_rgba(94,231,223,0.15)] active:scale-[0.98] transition-all flex items-center justify-center" type="submit">
                Create account
            </button>
</form>
<!-- Footer Link -->
<div class="text-center">
<a class="text-sm font-medium text-on-surface-variant hover:text-primary transition-colors inline-flex items-center gap-1" href="#">
                Already have an account? <span class="text-primary-container">Log in</span>
</a>
</div>
</main>
</body></html>
