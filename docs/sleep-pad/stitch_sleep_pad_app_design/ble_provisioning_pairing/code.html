<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Setup Sleep Pad - Pairing</title>

                    "on-primary-fixed": "#00201e",
                    "inverse-on-surface": "#2d3136",
                    "error-container": "#93000a",
                    "inverse-surface": "#e0e2ea",
                    "outline": "#859492",
                    "on-primary-container": "#006661",
                    "background": "#101419",
                    "outline-variant": "#3c4948",
                    "surface-container-high": "#262a30",
                    "secondary-container": "#553291",
                    "on-secondary-fixed": "#260058",
                    "on-background": "#e0e2ea",
                    "on-secondary-fixed-variant": "#553291",
                    "on-secondary-container": "#c5a5ff",
                    "on-tertiary": "#412d00",
                    "surface-container-lowest": "#0a0e13",
                    "on-surface": "#e0e2ea",
                    "primary": "#a4fff8",
                    "tertiary-container": "#ffcb64",
                    "on-tertiary-fixed": "#261900",
                    "on-tertiary-container": "#765500",
                    "on-error": "#690005",

                    "on-primary": "#003734",
                    "surface-dim": "#101419",
                    "secondary-fixed": "#ebdcff",
                    "tertiary-fixed": "#ffdea5",
                    "secondary-fixed-dim": "#d4bbff",
                    "on-surface-variant": "#bbc9c7",

            "borderRadius": {

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar Container -->
<header class="fixed top-0 w-full z-50 h-16 bg-[#101419]/70 backdrop-blur-2xl shadow-[0_4px_40px_rgba(230,237,243,0.06)] bg-gradient-to-b from-[#101419] to-transparent">
<div class="flex justify-between items-center px-6 w-full max-w-screen-xl mx-auto h-full">
<button class="text-secondary opacity-60 hover:opacity-100 transition-opacity active:scale-[0.98] flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-['Inter'] font-semibold tracking-tight text-sm text-[#E6EDF3]">Setup Sleep Pad</h1>
<span class="text-[10px] text-secondary/60 tracking-wider font-medium uppercase mt-0.5">Step 2 of 3</span>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-12 px-6 flex flex-col items-center justify-center max-w-md mx-auto w-full relative z-10">
<!-- Ambient Glow Background -->
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary-container/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Hero: Pairing Ring -->
<div class="relative w-[240px] h-[240px] mb-12 flex items-center justify-center">
<!-- Outer sweeping glow ring (static representation) -->
<div class="absolute inset-0 rounded-full border-2 border-surface-container-high border-t-primary-container shadow-[0_0_30px_rgba(94,231,223,0.15)] opacity-80" style="transform: rotate(45deg);"></div>
<div class="absolute inset-2 rounded-full border border-surface-container border-b-primary shadow-[0_0_20px_rgba(164,255,248,0.1)] opacity-60" style="transform: rotate(-30deg);"></div>
<!-- Central core -->
<div class="w-[180px] h-[180px] bg-surface-container-lowest rounded-full shadow-[inset_0_4px_40px_rgba(0,0,0,0.8),_0_0_40px_rgba(94,231,223,0.05)] flex items-center justify-center border border-outline-variant/10 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/10 to-transparent"></div>
<span class="material-symbols-outlined text-6xl text-primary bg-clip-text text-transparent bg-gradient-to-br from-primary to-primary-container drop-shadow-[0_0_15px_rgba(94,231,223,0.3)]" style="font-variation-settings: 'wght' 200, 'FILL' 0;">bluetooth_searching</span>
</div>
</div>
<!-- Typography Context -->
<div class="text-center mb-10 w-full">
<h2 class="text-2xl font-bold tracking-tight text-on-surface mb-3">Pairing with device...</h2>
<p class="text-sm text-secondary/70 font-medium">This usually takes 10–30 seconds</p>
</div>
<!-- Status List Panel -->
<div class="w-full bg-surface-container-low rounded-xl p-6 border border-outline-variant/15 shadow-[0_20px_50px_rgba(0,0,0,0.3)] relative overflow-hidden">
<!-- Subtle internal gradient -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container/20 to-transparent"></div>
<ul class="space-y-6">
<!-- Step 1: Complete -->
<li class="flex items-center gap-4">
<div class="w-6 h-6 rounded-full bg-primary-container/10 flex items-center justify-center border border-primary-container/30 shrink-0">
<span class="material-symbols-outlined text-primary-container text-sm" style="font-variation-settings: 'wght' 600;">check</span>
</div>
<span class="text-sm font-medium text-on-surface/90">Saved Wi-Fi credentials</span>
</li>
<!-- Step 2: Active -->
<li class="flex items-center gap-4 relative">
<!-- Connector Line from prev -->
<div class="absolute -top-6 left-3 w-[1px] h-6 bg-primary-container/30"></div>
<div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 relative">
<div class="absolute inset-0 border-2 border-primary-container/20 border-t-primary-container rounded-full" style="transform: rotate(120deg);"></div>
<div class="w-2 h-2 bg-primary rounded-full shadow-[0_0_8px_rgba(164,255,248,0.8)]"></div>
</div>
<span class="text-sm font-semibold text-primary drop-shadow-[0_0_10px_rgba(164,255,248,0.2)]">Connecting to Pad</span>
</li>
<!-- Step 3: Pending -->
<li class="flex items-center gap-4 relative">
<!-- Connector Line from prev -->
<div class="absolute -top-6 left-3 w-[1px] h-6 bg-surface-container-highest"></div>
<div class="w-6 h-6 rounded-full border border-surface-container-highest flex items-center justify-center shrink-0 bg-surface-container-lowest">
</div>
<span class="text-sm font-medium text-secondary/40">Registering on Server</span>
</li>
<!-- Step 4: Pending -->
<li class="flex items-center gap-4 relative">
<!-- Connector Line from prev -->
<div class="absolute -top-6 left-3 w-[1px] h-6 bg-surface-container-highest"></div>
<div class="w-6 h-6 rounded-full border border-surface-container-highest flex items-center justify-center shrink-0 bg-surface-container-lowest">
</div>
<span class="text-sm font-medium text-secondary/40">Finalizing Setup</span>
</li>
</ul>
</div>
</main>
</body></html>
