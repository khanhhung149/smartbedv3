<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Alerts</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-variant": "#31353b",
                      "tertiary-container": "#ffcb64",
                      "surface-container-highest": "#31353b",
                      "on-background": "#e0e2ea",
                      "tertiary-fixed-dim": "#f2bf59",
                      "on-primary-container": "#006661",
                      "on-tertiary-fixed-variant": "#5d4200",
                      "secondary-fixed-dim": "#d4bbff",
                      "primary": "#a4fff8",
                      "on-error-container": "#ffdad6",
                      "inverse-surface": "#e0e2ea",
                      "surface-container-low": "#181c21",
                      "error-container": "#93000a",
                      "surface-container-lowest": "#0a0e13",
                      "error": "#ffb4ab",
                      "surface": "#101419",
                      "on-secondary-container": "#c5a5ff",
                      "primary-fixed": "#70f7ef",
                      "secondary": "#d4bbff",
                      "primary-container": "#5ee7df",
                      "inverse-on-surface": "#2d3136",
                      "on-tertiary-fixed": "#261900",
                      "outline": "#859492",
                      "on-primary": "#003734",
                      "surface-dim": "#101419",
                      "on-secondary": "#3e1779",
                      "on-error": "#690005",
                      "on-tertiary": "#412d00",
                      "on-secondary-fixed-variant": "#553291",
                      "on-primary-fixed": "#00201e",
                      "background": "#101419",
                      "on-surface-variant": "#bbc9c7",
                      "surface-container-high": "#262a30",
                      "secondary-container": "#553291",
                      "tertiary": "#ffedd1",
                      "on-secondary-fixed": "#260058",
                      "outline-variant": "#3c4948",
                      "on-surface": "#e0e2ea",
                      "surface-container": "#1c2025",
                      "on-primary-fixed-variant": "#00504c",
                      "inverse-primary": "#006a66",
                      "surface-tint": "#4fdad3",
                      "secondary-fixed": "#ebdcff",
                      "on-tertiary-container": "#765500",
                      "surface-bright": "#36393f",
                      "tertiary-fixed": "#ffdea5",
                      "primary-fixed-dim": "#4fdad3"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Inter"
                      ],
                      "body": [
                              "Inter"
                      ],
                      "label": [
                              "Inter"
                      ]
              }
      },
          },
        }
      </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #101419;
            color: #e0e2ea;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50 bg-[#101419]/70 backdrop-blur-2xl no-line tonal stacking shadow-[0_10px_40px_0_rgba(230,237,243,0.06)]">
<button class="text-[#8B96A5] hover:text-[#5EE7DF] transition-colors scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-lg font-bold text-[#E6EDF3] font-['Inter'] tracking-tight">Alerts</h1>
<button class="text-[#8B96A5] hover:text-[#5EE7DF] transition-colors scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-28 px-6 flex flex-col">
<!-- Tab Navigation (Mocked for context, as requested "History" tab selected in an Alerts screen, though not strictly in JSON, it implies a sub-nav) -->
<div class="flex space-x-4 mb-8">
<button class="px-4 py-2 rounded-full text-sm font-medium text-on-surface-variant hover:text-primary transition-colors">Active</button>
<button class="px-4 py-2 rounded-full text-sm font-medium text-primary-container bg-primary-container/10 transition-colors">History</button>
</div>
<!-- Empty State Container -->
<div class="flex-grow flex flex-col items-center justify-center space-y-6">
<!-- Illustration / Icon Container -->
<div class="w-32 h-32 rounded-full bg-surface-container flex items-center justify-center shadow-[0_10px_40px_0_rgba(230,237,243,0.06)]">
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center relative">
<!-- Subtle glow -->
<div class="absolute inset-0 rounded-full bg-gradient-to-br from-primary/20 to-primary-container/5 blur-xl"></div>
<span class="material-symbols-outlined text-6xl text-primary-container drop-shadow-md z-10" style="font-variation-settings: 'FILL' 0, 'wght' 200;">check_circle</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-2 max-w-xs">
<h2 class="text-2xl font-semibold text-on-surface tracking-tight font-headline">All clear.</h2>
<p class="text-on-surface-variant text-sm leading-relaxed">No alerts yet. That's good news.</p>
</div>
<!-- Action Button (Optional, but good for empty states) -->
<button class="mt-8 px-6 py-3 rounded-full bg-surface-container-high text-primary font-medium text-sm hover:bg-surface-container-highest transition-colors flex items-center space-x-2 border border-outline-variant/15">
<span class="material-symbols-outlined text-sm" data-icon="refresh">refresh</span>
<span>Refresh Status</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#101419]/70 backdrop-blur-3xl rounded-t-[32px] tonal depth shift shadow-[0_-10px_40px_0_rgba(0,0,0,0.4)] md:hidden">
<button class="flex flex-col items-center justify-center text-[#8B96A5] hover:bg-white/5 scale-98 active:scale-95 transition-all duration-200 rounded-full px-2 py-1">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-[#8B96A5] hover:bg-white/5 scale-98 active:scale-95 transition-all duration-200 rounded-full px-2 py-1">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide">History</span>
</button>
<button class="flex flex-col items-center justify-center text-[#5EE7DF] bg-[#5EE7DF]/10 rounded-full px-4 py-1 hover:bg-white/5 scale-98 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined mb-1" data-icon="notification_important">notification_important</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide">Alerts</span>
</button>
<button class="flex flex-col items-center justify-center text-[#8B96A5] hover:bg-white/5 scale-98 active:scale-95 transition-all duration-200 rounded-full px-2 py-1">
<span class="material-symbols-outlined mb-1" data-icon="devices">devices</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide">Devices</span>
</button>
<button class="flex flex-col items-center justify-center text-[#8B96A5] hover:bg-white/5 scale-98 active:scale-95 transition-all duration-200 rounded-full px-2 py-1">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide">Settings</span>
</button>
</nav>
<!-- Desktop Side Nav Spacer (Hidden on Mobile) to maintain layout consistency if scaled up -->
<div class="hidden md:flex fixed left-0 top-0 h-full w-24 bg-[#101419]/70 backdrop-blur-3xl border-r border-outline-variant/15 flex-col items-center py-8 space-y-8 z-40">
<!-- Mock side nav items for desktop representation -->
<button class="text-on-surface-variant hover:text-primary transition-colors p-3 rounded-xl hover:bg-surface-container-low"><span class="material-symbols-outlined">home</span></button>
<button class="text-on-surface-variant hover:text-primary transition-colors p-3 rounded-xl hover:bg-surface-container-low"><span class="material-symbols-outlined">history</span></button>
<button class="text-primary-container bg-primary-container/10 p-3 rounded-xl"><span class="material-symbols-outlined">notification_important</span></button>
<button class="text-on-surface-variant hover:text-primary transition-colors p-3 rounded-xl hover:bg-surface-container-low"><span class="material-symbols-outlined">devices</span></button>
<button class="text-on-surface-variant hover:text-primary transition-colors p-3 rounded-xl hover:bg-surface-container-low mt-auto"><span class="material-symbols-outlined">settings</span></button>
</div>
</body></html>
