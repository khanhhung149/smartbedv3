<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sleep Pad - Add Device</title>

          extend: {
            "colors": {

                    "on-secondary": "#3e1779",

                    "on-secondary-fixed": "#260058",
                    "on-primary": "#003734",

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="sticky docked full-width top-0 z-50 bg-[#101419]/70 backdrop-blur-2xl no-border tonal-depth-stacking shadow-none flex flex-col w-full">
<div class="flex justify-between items-center w-full px-6 py-4">
<button class="text-[#5EE7DF] active:scale-[0.98] transition-transform duration-200 hover:bg-white/5 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="flex flex-col items-center justify-center">
<h1 class="font-['Inter'] font-semibold tracking-tight text-lg text-[#E6EDF3]">Add Device</h1>
<button class="flex items-center gap-1 text-xs text-outline mt-1 hover:text-primary transition-colors">
<span>Grandma's room</span>
<span class="material-symbols-outlined text-[16px]">arrow_drop_down</span>
</button>
</div>
<button class="text-[#8B96A5] active:scale-[0.98] transition-transform duration-200 hover:bg-white/5 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-high overflow-hidden">
<div class="h-full bg-gradient-to-r from-primary to-primary-container w-1/3 animate-[pulse_2s_ease-in-out_infinite] rounded-r-full"></div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-6 pt-8 pb-32 flex flex-col gap-6 max-w-md mx-auto w-full">
<div class="flex flex-col gap-4">
<h2 class="text-sm font-medium text-outline uppercase tracking-wider pl-2">Nearby Devices</h2>
<!-- Device Card 1 -->
<button class="w-full bg-surface-container-low rounded-[20px] p-4 flex items-center gap-4 active:scale-[0.98] transition-transform duration-200 border border-outline-variant/15 hover:bg-surface-container/80 text-left">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary-container shrink-0">
<span class="material-symbols-outlined">bluetooth</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<span class="font-bold text-[#E6EDF3] tracking-tight">SleepPad-000001</span>
<span class="text-sm text-[#8B96A5] mt-0.5 flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
                        Strong signal
                    </span>
</div>
<span class="material-symbols-outlined text-[#8B96A5]">chevron_right</span>
</button>
<!-- Device Card 2 -->
<button class="w-full bg-surface-container-low rounded-[20px] p-4 flex items-center gap-4 active:scale-[0.98] transition-transform duration-200 border border-outline-variant/15 hover:bg-surface-container/80 text-left">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary-container shrink-0">
<span class="material-symbols-outlined">bluetooth</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<span class="font-bold text-[#E6EDF3] tracking-tight">SleepPad-000002</span>
<span class="text-sm text-[#8B96A5] mt-0.5 flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary-container"></span>
                        Moderate signal
                    </span>
</div>
<span class="material-symbols-outlined text-[#8B96A5]">chevron_right</span>
</button>
</div>
<!-- Scanning Status -->
<div class="flex flex-col items-center justify-center py-12 gap-4 opacity-70">
<div class="w-16 h-16 rounded-full border-2 border-dashed border-outline-variant/50 flex items-center justify-center animate-[spin_4s_linear_infinite]">
<span class="material-symbols-outlined text-outline">radar</span>
</div>
<p class="text-sm text-outline font-medium tracking-wide">Searching for nearby devices...</p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-[#101419]/70 backdrop-blur-3xl docked full-width rounded-t-[32px] tonal-shift-via-opacity shadow-[0_-8px_40px_rgba(0,0,0,0.4)] md:hidden">
<button class="flex flex-col items-center justify-center text-[#8B96A5] px-4 py-2 hover:text-[#E6EDF3] active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-[#8B96A5] px-4 py-2 hover:text-[#E6EDF3] active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest mt-1">History</span>
</button>
<button class="flex flex-col items-center justify-center text-[#8B96A5] px-4 py-2 hover:text-[#E6EDF3] active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest mt-1">Alerts</span>
</button>
<button class="flex flex-col items-center justify-center bg-[#5EE7DF]/10 text-[#5EE7DF] rounded-full px-4 py-2 active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined" data-icon="devices" style="font-variation-settings: 'FILL' 1;">devices</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest mt-1">Devices</span>
</button>
<button class="flex flex-col items-center justify-center text-[#8B96A5] px-4 py-2 hover:text-[#E6EDF3] active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest mt-1">Settings</span>
</button>
</nav>
</body></html>
