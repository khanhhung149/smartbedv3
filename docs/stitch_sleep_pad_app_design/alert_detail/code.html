<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Alert Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-container": "#ffcb64",
                    "primary-fixed-dim": "#4fdad3",
                    "background": "#101419",
                    "surface-dim": "#101419",
                    "on-tertiary": "#412d00",
                    "secondary": "#d4bbff",
                    "on-secondary-fixed": "#260058",
                    "inverse-primary": "#006a66",
                    "secondary-container": "#553291",
                    "tertiary-fixed": "#ffdea5",
                    "tertiary": "#ffedd1",
                    "surface-container-low": "#181c21",
                    "error-container": "#93000a",
                    "surface": "#101419",
                    "on-primary-fixed-variant": "#00504c",
                    "on-secondary-fixed-variant": "#553291",
                    "on-surface": "#e0e2ea",
                    "on-error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#f2bf59",
                    "primary-fixed": "#70f7ef",
                    "surface-container": "#1c2025",
                    "surface-container-lowest": "#0a0e13",
                    "on-error": "#690005",
                    "surface-container-high": "#262a30",
                    "on-tertiary-container": "#765500",
                    "surface-bright": "#36393f",
                    "on-primary": "#003734",
                    "on-primary-fixed": "#00201e",
                    "surface-container-highest": "#31353b",
                    "surface-tint": "#4fdad3",
                    "secondary-fixed": "#ebdcff",
                    "on-primary-container": "#006661",
                    "on-surface-variant": "#bbc9c7",
                    "on-tertiary-fixed-variant": "#5d4200",
                    "error": "#ffb4ab",
                    "outline": "#859492",
                    "on-secondary-container": "#c5a5ff",
                    "on-secondary": "#3e1779",
                    "inverse-surface": "#e0e2ea",
                    "surface-variant": "#31353b",
                    "inverse-on-surface": "#2d3136",
                    "secondary-fixed-dim": "#d4bbff",
                    "on-tertiary-fixed": "#261900",
                    "on-background": "#e0e2ea",
                    "outline-variant": "#3c4948",
                    "primary": "#a4fff8",
                    "primary-container": "#5ee7df"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {},
            "fontFamily": {
                    "headline": [
                            "Inter"
                    ],
                    "body": [
                            "Inter"
                    ],
                    "label": [
                            "Inter"
                    ]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #101419; /* background */
            color: #e0e2ea; /* on-background */
        }
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-40 bg-[#101419]/70 backdrop-blur-md flex items-center justify-between px-6 py-4 w-full">
<button class="text-[#5EE7DF] hover:opacity-80 transition-opacity scale-95 active:scale-90 duration-200 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-semibold tracking-tight text-lg text-on-surface">Alert Detail</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="pt-24 px-6 max-w-md mx-auto space-y-8">
<!-- Hero Banner: Alert Summary -->
<section class="rounded-xl bg-error-container/20 border border-error-container/30 p-6 flex flex-col items-center text-center space-y-4">
<div class="w-16 h-16 rounded-full bg-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-error-container text-4xl" data-icon="warning">warning</span>
</div>
<div>
<h2 class="text-2xl font-bold tracking-tight text-error mb-2">Heart Rate was high</h2>
<p class="text-on-surface-variant text-sm">Alice's Pad · <span class="text-on-surface font-medium">131 bpm</span> for 1 minute, threshold 120</p>
</div>
</section>
<!-- Info Grid -->
<section class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-low rounded-lg p-4 flex flex-col">
<span class="text-on-surface-variant text-xs font-medium uppercase tracking-wider mb-1">Time</span>
<span class="text-on-surface text-sm font-medium">Today, 3:00 AM</span>
</div>
<div class="bg-surface-container-low rounded-lg p-4 flex flex-col">
<span class="text-on-surface-variant text-xs font-medium uppercase tracking-wider mb-1">Device</span>
<span class="text-on-surface text-sm font-medium">Master Bedroom</span>
</div>
</section>
<!-- Chart Section -->
<section class="bg-surface-container-low rounded-xl p-6">
<h3 class="text-lg font-semibold tracking-tight text-on-surface mb-6">What happened</h3>
<!-- Simplified abstract chart representation -->
<div class="relative h-48 w-full bg-surface-container rounded-lg border border-outline-variant/15 overflow-hidden flex items-end">
<!-- Background grid lines -->
<div class="absolute inset-0 flex flex-col justify-between py-4 px-2 opacity-10">
<div class="w-full h-px bg-on-surface"></div>
<div class="w-full h-px bg-on-surface"></div>
<div class="w-full h-px bg-on-surface"></div>
<div class="w-full h-px bg-on-surface"></div>
</div>
<!-- SVG Chart Line (Abstract representation of a spike) -->
<svg class="absolute bottom-0 w-full h-full preserve-aspect-ratio-none stroke-error fill-none z-10" vector-effect="non-scaling-stroke" viewbox="0 0 100 50">
<path d="M 0,40 L 20,42 L 40,38 L 50,10 L 60,35 L 80,39 L 100,40" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<!-- Fill gradient under line -->
<path class="fill-error/10 stroke-none" d="M 0,50 L 0,40 L 20,42 L 40,38 L 50,10 L 60,35 L 80,39 L 100,40 L 100,50 Z"></path>
</svg>
<!-- Threshold Line -->
<div class="absolute top-1/3 left-0 w-full border-t border-dashed border-error/50 z-20"></div>
<span class="absolute top-1/3 left-2 text-[10px] text-error/70 -mt-4">Threshold (120)</span>
</div>
<div class="flex justify-between mt-2 text-xs text-on-surface-variant">
<span>2:55 AM</span>
<span>3:05 AM</span>
</div>
</section>
<!-- Actions -->
<section class="space-y-4 pt-4">
<button class="w-full py-4 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-semibold tracking-wide shadow-[0_4px_20px_rgba(94,231,223,0.15)] hover:opacity-90 active:scale-98 transition-all duration-200">
                View in History
            </button>
<button class="w-full py-4 rounded-full border border-outline/20 text-on-surface font-medium hover:bg-surface-container transition-colors duration-200">
                Adjust threshold
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-8 pt-4 bg-[#101419]/70 backdrop-blur-2xl rounded-t-[32px] shadow-[0_-4px_40px_rgba(0,0,0,0.4)] border-t border-white/5">
<button class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 hover:bg-white/5 transition-colors scale-98 active:scale-95 duration-200 px-2 py-2 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 hover:bg-white/5 transition-colors scale-98 active:scale-95 duration-200 px-2 py-2 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest">History</span>
</button>
<!-- Active Tab: Alerts -->
<button class="flex flex-col items-center justify-center bg-[#5EE7DF]/10 text-[#5EE7DF] rounded-full px-4 py-2 scale-98 active:scale-95 duration-200">
<span class="material-symbols-outlined mb-1" data-icon="notifications" data-weight="fill" style="font-variation-settings: 'FILL' 1;">notifications</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest">Alerts</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 hover:bg-white/5 transition-colors scale-98 active:scale-95 duration-200 px-2 py-2 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="devices_other">devices_other</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest">Devices</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 hover:bg-white/5 transition-colors scale-98 active:scale-95 duration-200 px-2 py-2 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-widest">Settings</span>
</button>
</nav>
</body></html>
