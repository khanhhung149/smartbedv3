<div class="flex items-end justify-between">
<span class="text-2xl font-bold text-on-background">68 <span class="text-sm text-[#8B96A5] font-normal">bpm</span></span>

</div>

<span>80</span>
<span>40</span>

<div class="absolute top-1/2 w-full border-t border-outline-variant/10"></div>
<div class="absolute bottom-0 w-full border-t border-outline-variant/10"></div>

<svg class="w-full h-full absolute inset-0" preserveaspectratio="none" viewbox="0 0 100 100">

<defs>
<lineargradient id="hrGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#5EE7DF" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#5EE7DF" stop-opacity="0"></stop>
</lineargradient>
</defs>
<!-- Fill -->
<path d="M0,60 C20,40 40,70 50,50 C60,30 80,60 100,45 L100,100 L0,100 Z" fill="url(#hrGradient)"></path>
<!-- Line -->
<path d="M0,60 C20,40 40,70 50,50 C60,30 80,60 100,45" fill="none" stroke="#5EE7DF" stroke-width="2" vector-effect="non-scaling-stroke"></path>
</svg>
<!-- Scrubber / Tooltip -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[10px] flex flex-col items-center">

<span class="text-primary-container">68 bpm</span> <span class="text-[#8B96A5] mx-1">·</span> Wed 3:00am
                            </div>

</div>
