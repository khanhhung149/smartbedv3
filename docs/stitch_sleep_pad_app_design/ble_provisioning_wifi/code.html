<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                      "surface-variant": "#31353b",
                      "tertiary": "#ffedd1",
                      "surface-container-low": "#181c21",
                      "on-primary-fixed": "#00201e",
                      "inverse-on-surface": "#2d3136",
                      "error-container": "#93000a",
                      "inverse-surface": "#e0e2ea",
                      "outline": "#859492",
                      "on-primary-container": "#006661",

                      "outline-variant": "#3c4948",

                      "secondary-container": "#553291",

                      "on-background": "#e0e2ea",

                      "on-primary": "#003734",
                      "surface-dim": "#101419",

                      "tertiary-fixed": "#ffdea5",

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body min-h-screen antialiased flex flex-col">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 h-16 bg-[#101419]/70 backdrop-blur-2xl shadow-[0_4px_40px_rgba(230,237,243,0.06)] bg-gradient-to-b from-[#101419] to-transparent">
<div class="flex justify-between items-center px-6 w-full max-w-screen-xl mx-auto h-full">
<button class="text-secondary hover:text-primary transition-colors active:scale-[0.98] duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline font-bold text-lg tracking-tight text-on-surface">Setup Sleep Pad</h1>
<span class="font-label text-[10px] text-secondary tracking-wide uppercase">1 of 3</span>
</div>
<div class="w-6"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-6 flex flex-col items-center justify-center max-w-md mx-auto w-full relative">
<!-- Icon Anchor -->
<div class="w-24 h-24 rounded-full bg-surface-container-highest flex items-center justify-center mb-10 relative">
<div class="absolute inset-0 rounded-full border border-primary/20 animate-[pulse_3s_ease-in-out_infinite]"></div>
<div class="absolute inset-2 rounded-full border border-primary/10 animate-[pulse_3s_ease-in-out_infinite_0.5s]"></div>
<span class="material-symbols-outlined text-5xl text-primary drop-shadow-[0_0_15px_rgba(94,231,223,0.3)]" data-icon="wifi">wifi</span>
</div>
<!-- Typography Cluster -->
<div class="text-center mb-12 space-y-4">
<h2 class="font-headline text-3xl font-extrabold tracking-tight text-primary">Give your Sleep Pad WiFi</h2>
<p class="font-body text-secondary text-sm leading-relaxed max-w-[280px] mx-auto">Your Sleep Pad will use this network to send data to the cloud.</p>
</div>
<!-- Input Glass Pane -->
<div class="w-full space-y-6">
<!-- Network Input -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-xl" data-icon="router">router</span>
</div>
<select class="w-full bg-surface-container-lowest border-0 rounded-DEFAULT py-4 pl-12 pr-10 text-on-surface focus:ring-1 focus:ring-primary/40 focus:outline-none appearance-none font-body transition-shadow">
<option class="text-secondary" disabled="" selected="" value="">Select Network</option>
<option value="home">Home_Network_5G</option>
<option value="guest">Guest_Network</option>
<option value="lab">Lab_Test_Env</option>
</select>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<!-- Password Input -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-xl" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border-0 rounded-DEFAULT py-4 pl-12 pr-12 text-on-surface focus:ring-1 focus:ring-primary/40 focus:outline-none placeholder-secondary/50 font-body transition-shadow" placeholder="Password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- CTA Anchor -->
<div class="w-full mt-16">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-headline font-semibold py-4 rounded-full shadow-[0_0_20px_rgba(94,231,223,0.15)] active:scale-[0.98] transition-transform duration-200">
                Continue
            </button>
</div>
</main>
<!-- Suppressed Bottom Nav as per intent logic for Transactional screens -->
</body></html>
