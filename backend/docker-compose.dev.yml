# Sleep Pad Platform — Development Override
# Local LAN access: direct port mappings, anonymous MQTT, hot-reload FastAPI.
# No cloudflared tunnel — ESP32 and Flutter app access via LAN IP (e.g. 192.168.1.100).

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  mosquitto:
    volumes:
      - ./mosquitto/mosquitto-dev.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"   # TCP MQTT for ESP32 on LAN
      - "9001:9001"   # WebSocket MQTT for browser testing

  fastapi:
    ports:
      - "8000:8000"
    environment:
      # Dev uses TCP 1883 directly (ws/wss only needed for cloudflared prod).
      # Host = Mac LAN IP so ESP32 can reach the broker. Firmware's PubSubClient
      # supports only "tcp" scheme — ws/wss are deferred to prod via a bridge.
      MQTT_DOMAIN: "tcp://192.168.1.15:1883"
    volumes:
      - ./app:/app                              # hot-reload source code
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
