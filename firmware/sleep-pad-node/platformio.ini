; PlatformIO Project Configuration
; Sleep Pad ESP32-C3 Super Mini — BLE provisioning + MQTT telemetry.
; ESP-IDF thuần (framework = espidf) — đồng bộ với firmware/radar-node, xem plan
; plans/260824-1109-dong-bo-sleep-pad-node-esp-idf/plan.md. Bản Arduino cũ (esp32dev /
; esp32-c3-devkitm-1 + framework=arduino) đã bị THAY THẾ hoàn toàn, không giữ song song —
; node này chỉ chạy trên board thật ESP32-C3 Super Mini.

; Build ra ổ ext4 của WSL thay vì .pio/ trong repo (repo nằm trên /mnt/d — ổ Windows qua
; 9p). Cùng lý do như radar-node/voice-node: build dir chứa hàng nghìn file .o/.d mà
; SCons phải stat từng cái mỗi lần chạy, qua 9p chi phí đó áp đảo cả thời gian biên dịch
; thật. Đánh đổi: build dir nằm NGOÀI repo nên `git clean` không dọn nó.
[platformio]
build_dir = /home/hung/.pio-builds/sleep-pad-node

; ESP32-C3 Super Mini (RISC-V, native USB-C CDC, BLE 5.0, WiFi 2.4 GHz). Board id
; `nologo_esp32c3_super_mini` khớp đúng biến thể phần cứng (khác `esp32-c3-devkitm-1`
; dùng tạm ở bản Arduino cũ). Ghim CÙNG pioarduino 55.03.311 (IDF 5.5.5) như radar-node
; để hai node ESP-IDF thuần trong repo không trôi toolchain độc lập nhau.
[env:c3supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = nologo_esp32c3_super_mini
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200

; Mock build — synthesizes sleep-pad telemetry so the pipeline can be smoke-tested with
; just the ESP32-C3 on the bench (no physical sleep pad).
; Flash via:  pio run -e c3supermini-mock -t upload -t monitor
[env:c3supermini-mock]
extends = env:c3supermini
build_flags = -DMOCK_SLEEPPAD=1
