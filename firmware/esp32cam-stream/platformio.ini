; esp32cam-stream — AI-Thinker ESP32-CAM (OV2640), một việc duy nhất: phục vụ MJPEG
; stream qua HTTP trong LAN để laptop chạy pose estimation trực tiếp. Thay node
; esp32cam-node cũ (chụp -> ghi microSD -> rút thẻ ra xem), vòng phản hồi quá chậm để
; nghiệm thu ý tưởng quan sát tư thế ngủ bằng vision.
; Quyết định đầy đủ: plans/260814-1237-esp32cam-stream-mediapipe-poc/
;
; KHÔNG có tầng lưu trữ. Không SD, không FATFS, không fopen. Frame chỉ tồn tại trong
; lúc truyền và mất khi tắt nguồn — đó chính là mitigation của
; docs/safety/hazard-analysis.md H-25, không phải cờ build có thể bật nhầm.
;
; framework = espidf THUẦN (không arduino, không mix) — quy tắc toolchain toàn dự án,
; xem firmware/README.md. Managed component espressif/esp32-camera khai trong
; src/idf_component.yml.
;
; Flash:  pio run -t upload -e esp32cam
; Serial: pio device monitor          (IP in ra lúc boot)
;
; Wiring: chỉ camera. Không cắm gì vào GPIO4 — trên AI-Thinker GPIO4 nối thẳng đèn
; flash trắng; mọi thiết bị I2C đặt ở đó sẽ làm đèn nhấp nháy suốt đêm. Đó là hazard
; H-26 cũ, đã nghỉ hưu cùng lúc VL53L0X bị bỏ (xem mục "Retired hazards" trong
; docs/safety/hazard-analysis.md). Cắm lại là hazard sống lại.
;
; ⚠️ Nguồn RIÊNG 5V/2A — KHÔNG lấy từ cổng USB laptop/Jetson (H-20). Camera + WiFi TX
; đồng thời kéo dòng đỉnh cao; thiếu dòng gây brownout trông y hệt bug phần mềm.

[env:esp32cam]
; Ghim version cụ thể — KHÔNG để resolve mặc định. framework = espidf thuần là trường
; hợp rủi ro cao nhất cho version drift (Espressif ghép Arduino/IDF khác nhau tuỳ bản
; platform). 55.3.311 đã build SUCCESS thật trên node cũ (13/08).
platform = espressif32@55.3.311
board = esp32cam
framework = espidf
monitor_speed = 115200
; Board mặc định nạp ở 460800 baud. Bring-up thật 13/08 gặp "Serial data stream
; stopped: possible noise" ở tốc độ đó trên kết nối USB-TTL. Giảm xuống 115200 đáng
; tin cậy hơn; nạp lâu hơn vài giây, không đáng để đổi lại.
upload_speed = 115200
