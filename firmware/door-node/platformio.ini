; Door node — Wemos S2 Mini (ESP32-S2). Đọc PIR, publish home/door/motion.
; Flash:  pio run -t upload -e lolin_s2_mini
; Serial: pio device monitor

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
; Bật USB CDC on boot để Serial.print ra cổng USB (xem log qua `pio device monitor`).
; S2 Mini mặc định tắt -> log đi ra UART0 (GPIO43/44), không thấy trên USB.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; MQTT client hỗ trợ publish QoS 1 thật (PubSubClient chỉ QoS 0 khi publish)
    256dpi/MQTT@^2.5
