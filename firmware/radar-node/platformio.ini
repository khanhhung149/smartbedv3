[platformio]
; Build ra ổ ext4 của WSL thay vì .pio/ trong repo (repo nằm trên /mnt/d — ổ Windows qua 9p).
; Cùng lý do như voice-node: build dir chứa hàng nghìn file .o/.d mà SCons phải stat từng cái mỗi
; lần chạy, qua 9p chi phí đó áp đảo cả thời gian biên dịch thật.
; Đánh đổi: build dir nằm NGOÀI repo nên `git clean` không dọn nó — muốn build sạch thì xoá tay.
build_dir = /home/hung/.pio-builds/radar-node

; ── radar-node: Wemos S2 Mini (ESP32-S2) + radar LD2410C ─────────────────────────────────────
; Đọc LD2410C native qua UART + chân OUT (không firmware bên thứ ba, không ESP-NOW) rồi bắn thẳng
; lên broker theo HAI contract sẵn có:
;   1) home/room/presence  {"ts":<ms>,"present":bool}          -> backend Go ăn, đẩy vào app
;   2) tele/<topic>/SENSOR + trả lời cmnd/<topic>/STATUS 10     -> tab "Thiết bị" của app đọc thẳng
;
; Wiring (xem docs/system-wiring.md):
;   LD2410 OUT -> GPIO16     LD2410 TX -> GPIO33 (S2 nhận)     LD2410 RX -> GPIO18 (S2 gửi)
;   LD2410 VCC -> 5V         LD2410 GND -> GND
;   ⚠️ Nuôi radar bằng 5V, KHÔNG hàn đè lên cổng USB-C (đã gây chập ở bản trước).
;
; VÌ SAO ESP-IDF THUẦN (đổi từ Arduino 18/08):
; `platform = espressif32` không ghim resolve tới bản mới nhất, tức toolchain của node này trôi
; độc lập với voice-node — hai node cùng repo mà khác cả Arduino core lẫn IDF nền. Nay cả hai ghim
; CÙNG pioarduino 55.03.311 (IDF 5.5.5): voice-node chạy `arduino, espidf` vì cần Arduino cho
; WebSockets/IRremote, radar-node không dùng thư viện Arduino nào nên chạy espidf thuần.
; Đổi lại: ArduinoOTA/espota không có bản IDF -> nạp qua WiFi giờ là POST /update (xem src/ota.c).
;
; Nạp:    pio run -t upload -e lolin_s2_mini   (giữ BOOT + tap RST để vào bootloader)
; Serial: pio device monitor
[env:lolin_s2_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = lolin_s2_mini
framework = espidf
monitor_speed = 115200

; PHẢI khai ở đây, không chỉ trong sdkconfig: PlatformIO sinh partitions.bin theo khoá này, thiếu
; nó là rơi về bảng mặc định single-app (bài học từ voice-node, xem git history file đó).
board_build.partitions = partitions.csv

; Nạp qua WiFi sau lần USB đầu tiên (hết cảnh usbipd attach + tháo dây 5V).
;   export OTA_PASSWORD='...'   (khớp OTA_PASSWORD trong include/config.h)
;   pio run -e lolin_s2_mini_ota -t upload
; Giữ env USB ở trên làm đường lui: bản nào làm chết WiFi thì OTA bó tay.
;
; espota (ArduinoOTA) không còn: phía thiết bị nay là endpoint HTTP trong src/ota.c, nên nạp bằng
; curl. `-H "Expect:"` tắt bước 100-continue của curl — esp_http_server không trả lời bước đó và
; curl sẽ đứng chờ 1 giây mỗi lần nạp.
[env:lolin_s2_mini_ota]
extends = env:lolin_s2_mini
upload_protocol = custom
upload_command = curl -sSf -m 180 -H "X-OTA-Password: ${sysenv.OTA_PASSWORD}" -H "Expect:" --data-binary @$SOURCE http://radar-node.local/update
