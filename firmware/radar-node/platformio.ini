; Radar node — Wemos S2 Mini (ESP32-S2) + radar LD2410C.
; Tự nối WiFi + MQTT, đọc LD2410C native qua UART (không firmware bên thứ ba, không ESP-NOW) rồi
; bắn thẳng lên broker theo HAI contract sẵn có:
;   1) home/room/presence  {"ts":<ms>,"present":bool}  -> backend Go ăn, đẩy vào app
;   2) tele/<topic>/SENSOR + trả lời cmnd/<topic>/STATUS 10  -> tab "Thiết bị" của app đọc thẳng
; Đây là bản thay cho firmware cũ trên con S2: cùng khuôn topic nên app không phải đổi gì.
;
; Wiring (xem docs/system-wiring.md):
;   LD2410 OUT -> GPIO16     LD2410 TX -> GPIO33 (S2 nhận)     LD2410 RX -> GPIO18 (S2 gửi)
;   LD2410 VCC -> 5V         LD2410 GND -> GND
;   ⚠️ Nuôi radar bằng 5V, KHÔNG hàn đè lên cổng USB-C (đã gây chập ở bản trước).
;
; Nạp:    pio run -t upload -e lolin_s2_mini   (giữ BOOT + tap RST để vào bootloader)
; Serial: pio device monitor

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
; S2 Mini mặc định đẩy Serial ra UART0 (GPIO43/44). Bật USB-CDC để log ra cổng USB.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; Loại selftest.cpp khỏi firmware chính (nó có setup/loop riêng, sẽ đụng nhau).
build_src_filter = +<*> -<selftest.cpp>
lib_deps =
    ; Parser giao thức UART LD2410 (đừng tự viết theo trí nhớ — datasheet là ảnh scan).
    ncmreynolds/ld2410
    ; MQTT client: publish presence + SENSOR, trả lời poll STATUS 10.
    256dpi/MQTT@^2.5
; ArduinoOTA + Update nằm sẵn trong core ESP32, không cần khai lib_deps.

; Nạp qua WiFi sau lần USB đầu tiên (hết cảnh usbipd attach + tháo dây 5V).
;   export OTA_PASSWORD='...'   (khớp OTA_PASSWORD trong include/config.h)
;   pio run -e lolin_s2_mini_ota -t upload
; Giữ env USB ở trên làm đường lui: bản nào làm chết WiFi thì OTA bó tay.
[env:lolin_s2_mini_ota]
extends = env:lolin_s2_mini
upload_protocol = espota
upload_port = radar-node.local    ; đổi thành IP nếu mDNS không phân giải được
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}

; Chẩn đoán UART LD2410 (throwaway): chỉ build src/selftest.cpp, không WiFi/MQTT.
;   pio run -e selftest -t upload --upload-port <cổng>   ;  pio device monitor -e selftest
[env:selftest]
extends = env:lolin_s2_mini
build_src_filter = +<selftest.cpp> -<main.cpp>
