; Room node — Wemos S2 Mini (ESP32-S2) + radar LD2410.
; Chỉ đọc radar rồi gửi sang voice-node qua ESP-NOW. Không WiFi/MQTT/NTP/OTA.
;
; KHÔNG CÓ ENV OTA (khác voice-node): board này bỏ WiFi nên không nạp qua mạng được.
; Đánh đổi user đã chấp nhận khi chọn ESP-NOW — xem plans/260717-1105-espnow-esp32-main-board/.
;
; Nạp:    pio run -t upload -e lolin_s2_mini   (giữ BOOT + tap RST để vào bootloader)
; Serial: pio device monitor

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
; Bật USB CDC on boot để Serial.print ra cổng USB (xem log qua `pio device monitor`).
; S2 Mini mặc định tắt -> log đi ra UART0 (GPIO43/44), không thấy trên USB.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; ESP-NOW nằm sẵn trong core ESP32 — không cần lib_deps.
; Đã gỡ: 256dpi/MQTT (không publish nữa, voice-node relay hộ),
;        crankyoldgit/IRremoteESP8266 (IR dời sang voice-node).

; Parser giao thức UART của LD2410. KHÔNG tự viết theo trí nhớ: datasheet bản PDF
; là ảnh scan nên không đối chiếu được offset từng byte.
lib_deps = ncmreynolds/ld2410
