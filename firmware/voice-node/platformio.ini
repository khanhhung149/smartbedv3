; Voice node — ESP32-WROOM-32 (38 chân) + mic INMP441 (I2S).
; Đọc mic, VAD năng lượng tại board, stream PCM16 16kHz mono qua WebSocket
; tới backend /api/voice/stream khi có tiếng nói.
; Flash:  pio run -t upload -e esp32dev
; Serial: pio device monitor
; WROOM-32 không có USB-CDC riêng -> Serial ra UART0 bình thường, không cần
; -DARDUINO_USB_CDC_ON_BOOT (khác S2 Mini).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ; WebSocket client nhị phân (RFC6455) để stream PCM tới backend ASR
    links2004/WebSockets@^2.7.3
    ; MQTT client để publish home/door/motion khi PIR kích (fusion ở backend)
    256dpi/MQTT@^2.5
; ArduinoOTA + Update nằm sẵn trong core ESP32, không cần khai lib_deps.

; Nạp qua WiFi — dùng khi board ĐÃ chạy firmware có OTA (phải nạp USB 1 lần đầu để kích hoạt).
;   pio run -e esp32dev_ota -t upload
; Giữ env esp32dev ở trên làm ĐƯỜNG LUI: bản nào làm chết WiFi thì OTA bó tay.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = voice-node.local    ; đổi thành IP nếu mDNS không phân giải được
upload_flags =
    ; Mật khẩu đọc từ biến môi trường — KHÔNG ghi vào file này (platformio.ini nằm trong git).
    ;   export OTA_PASSWORD='...'   (phải khớp OTA_PASSWORD trong include/config.h)
    --auth=${sysenv.OTA_PASSWORD}
