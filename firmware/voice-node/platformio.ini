[platformio]
; Build ra ổ ext4 của WSL thay vì .pio/ trong repo (repo nằm trên /mnt/d — ổ Windows qua 9p).
; Vì sao: build dir chứa hàng nghìn file .o/.d, mà SCons phải stat từng cái mỗi lần chạy. Qua 9p
; chi phí đó áp đảo: đo 14/08 thấy `pio run` mất 7-13 phút dù KHÔNG đổi dòng code nào, và suốt
; nhiều phút đầu không có tiến trình cc1plus nào — thời gian nằm ở khâu quét, không phải biên dịch.
; Toolchain/framework vốn đã nằm ở ~/.platformio (ext4), chỉ build dir của project còn kẹt trên 9p.
;
; Đánh đổi: build dir nằm NGOÀI repo nên `git clean` không dọn nó. Muốn build sạch thì xoá tay
; thư mục dưới đây.
build_dir = /home/hung/.pio-builds/esp32-presence-ac

; ── voice-node: ESP32-S3-DevKitC-1 N16R8 (16MB flash, 8MB PSRAM octal, ăng-ten IPEX) ──────────
; Đọc mic INMP441 (I2S), chốt wakeword "vừng ơi" tại board, stream PCM16 16kHz mono qua WebSocket
; tới backend /api/voice/stream. MỘT env duy nhất:
;   pio run -e esp32s3_kws -t upload                 (USB, cổng TTL)
;   pio run -e esp32s3_kws_ota -t upload             (WiFi, cần board đã chạy bản có OTA)
;
; Các env cũ BỎ 18/08 sau khi đường wakeword chạy ổn định nhiều tuần:
;   esp32dev / esp32dev_ota  — ESP32-WROOM-32, phần cứng đã thay hẳn bằng S3
;   esp32s3                  — đường lui VAD năng lượng, không còn dùng để mở stream
;   esp32s3_record           — thu mẫu WAV; thay bằng ASR_DUMP_DIR ở service ASR
; Lịch sử và lý do từng lựa chọn nằm trong git history của file này.
;
; CẮM VÀO CỔNG "TTL", KHÔNG PHẢI "OTG". Board S3-CAM có hai cổng USB-C:
;   TTL → chip CH340 → UART0 (GPIO43/44).  OTG → USB native của S3 (GPIO19/20).
; Chọn TTL vì USB native TỰ ENUMERATE LẠI mỗi lần reset — đó chính là nguyên nhân của bẫy "lần
; flash đầu luôn fail, phải chạy lại lần 2" đã gặp với S2 Mini. Qua CH340 thì auto-reset DTR/RTS
; chạy bình thường. Vì đi UART0 nên KHÔNG đặt -DARDUINO_USB_CDC_ON_BOOT=1: đặt vào là Serial nhảy
; sang cổng OTG và màn hình serial ở cổng TTL trống trơn.
;
; VÌ SAO PHẢI GHIM PLATFORM:
; `platform = espressif32` không ghim đã resolve tới 7.0.1, mà bản đó ghép Arduino 2.0.17 với
; ESP-IDF 6.0.1. Arduino 2.0.17 dựng trên IDF 4.4, nên dùng framework đơn lẻ thì chạy, còn
; `framework = arduino, espidf` (Arduino làm component của IDF) là hai phiên bản đá nhau. Thêm nữa
; IDF 6 nhiều khả năng đã gỡ driver/i2s.h legacy mà setupI2S() đang dùng.
; pioarduino 55.03.311 = Arduino 3.3.11 trên IDF 5.5.5 — hai thứ khớp nhau, và IDF 5.5 vẫn còn
; driver/i2s.h (deprecated, chưa gỡ).
;
; Lý do thật để sang ESP-IDF là esp-nn (kernel SIMD của S3, đưa inference wakeword từ ~50ms về
; <10ms) — KHÔNG phải để lấy ESP_SR. Wake word tiếng Việt tự chọn thì WakeNet không làm được.
[env:esp32s3_kws]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
lib_deps =
    ; WebSocket client nhị phân (RFC6455) để stream PCM tới backend ASR
    links2004/WebSockets@^2.7.3
    ; MQTT client: subscribe home/room/presence (từ radar-node) + home/room/ac_cmd để bắn IR
    256dpi/MQTT@^2.5
    ; Điều khiển điều hoà Daikin bằng giao thức có sẵn (không cần học mã, không cần TSOP)
    crankyoldgit/IRremoteESP8266@^2.8.6
; ArduinoOTA + Update nằm sẵn trong core ESP32, không cần khai lib_deps.

; components/espressif__esp-tflite-micro (local override, ưu tiên hơn managed_components/ cùng tên)
; dùng kernel DepthwiseConv2D reference thay vì esp-nn accelerated — bug thật esp-nn ghi đè bộ nhớ
; ngoài vùng cấp phát (Guru Meditation StoreProhibited, EXCVADDR rác, đo qua soak test + addr2line
; 2026-08-13), gây crash-loop ~1 lần/5 phút khi chạy wakeword liên tục. managed_components/ bị ESP-IDF
; component manager fetch lại + verify hash mỗi build (đã thử vá trực tiếp/watcher đè lại — verify hash
; phát hiện mismatch và fail cứng "component is corrupted", không đáng tin cậy) — components/ (local,
; ESP-IDF ưu tiên hơn, không bị sync) mới bền được. Chỉ ảnh hưởng wakeword (model snore không dùng
; DepthwiseConv2D). Xem components/espressif__esp-tflite-micro/CMakeLists.txt dòng "remove sources
; which will be provided by esp_nn" để biết đúng chỗ đổi.

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; PSRAM Octal 8MB của N16R8 (flash Quad + PSRAM Octal = tổ hợp chuẩn "qio_opi"). Không có dòng này,
; CONFIG_SPIRAM không được bật trong sdkconfig sinh ra dù chip có PSRAM vật lý thật (esptool xác nhận
; "Embedded PSRAM 8MB") — heap_caps_malloc(MALLOC_CAP_SPIRAM) thất bại êm re (trả nullptr), không crash
; nhưng buffer snore detection không cấp phát được (xem plans/260812-1029-...-scaffold/phase-01).
board_build.arduino.memory_type = qio_opi

; Bảng phân vùng: PHẢI khai ở đây, KHÔNG chỉ trong sdkconfig.
; Đã dính 04/08: sdkconfig.esp32s3_kws sinh ra đúng CONFIG_PARTITION_TABLE_CUSTOM=y và
; CUSTOM_FILENAME="partitions.csv", NHƯNG PlatformIO vẫn sinh partitions.bin theo
; board_build.partitions — thiếu dòng này nó rơi về bảng mặc định single-app 1MB.
; Hậu quả: firmware 1,22MB nạp vào ô 1MB, bootloader từ chối, board không boot được
; ("Image length 1218224 doesn't fit in partition length 1048576").
; KIỂM TRƯỚC KHI NẠP:
;   python .../gen_esp32part.py .pio/build/esp32s3_kws/partitions.bin
board_build.partitions = partitions.csv

build_flags =
    ; CHỈ biên dịch Daikin. Mặc định IRremoteESP8266 kéo vào hàng trăm giao thức của mọi hãng —
    ; thừa vài chục KB flash mà không bao giờ dùng.
    -D_IR_ENABLE_DEFAULT_=false
    -DSEND_DAIKIN=true
    -DSEND_DAIKIN152=true
    ; I2S: 5/6/7 nằm ngoài vùng flash (26-32), PSRAM octal (35-37) và strapping (0, 3, 45, 46).
    ; Trên board CAM chúng kiêm chân camera — vô hại khi không gắn camera.
    -DCFG_I2S_SCK=5
    -DCFG_I2S_WS=6
    -DCFG_I2S_SD=7
    ; IR sang GPIO8: GPIO4-7 trên board S3-CAM nằm ở header camera, chân sát nhau nên hàn tay khó.
    ; GPIO8 ở hàng GPIO thường, thoáng hơn. Không phải strapping, không thuộc bus flash/PSRAM.
    -DCFG_IR_PIN=8
    ; KHÔNG ghi đè CFG_I2S_CHAN: mặc định ONLY_RIGHT trong main.cpp đã đúng cho board này. Đã thử
    ; ONLY_LEFT ngày 30/07 và đo được RMS = 0.0 tuyệt đối (có pulldown chân SD nên số 0 này đáng
    ; tin) => mic KHÔNG lái nửa trái. Đừng thử lại hướng đó.
    ; DISABLE_RADAR_FUSION đã BỎ (10/08) — wakeword giờ là đường chính, không phải cô lập đo audio
    ; nữa. Radar/IR fusion chạy song song bình thường như env esp32s3, độc lập với wakeword gate.
    ;
    ; Cờ lịch sử từ thời còn env đường lui không có wakeword. Giữ lại vì code trong
    ; components/ và tài liệu vẫn nhắc tên nó; giờ luôn bật, không còn nhánh nào tắt.
    -DENABLE_WAKEWORD=1

; Nạp qua WiFi — dùng khi board ĐÃ chạy firmware có OTA (phải nạp USB một lần đầu để kích hoạt).
; USB vẫn là đường lui cuối: bản nào làm chết WiFi thì OTA bó tay.
[env:esp32s3_kws_ota]
extends = env:esp32s3_kws
upload_protocol = espota
upload_port = voice-node.local    ; đổi thành IP nếu mDNS không phân giải được
upload_flags =
    ; Mật khẩu đọc từ biến môi trường — KHÔNG ghi vào file này (platformio.ini nằm trong git).
    ;   export OTA_PASSWORD='...'   (phải khớp OTA_PASSWORD trong include/config.h)
    --auth=${sysenv.OTA_PASSWORD}
