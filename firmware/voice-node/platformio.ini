; Voice node — ESP32-WROOM-32 (38 chân) + mic INMP441 (I2S).
; Đọc mic, VAD năng lượng tại board, stream PCM16 16kHz mono qua WebSocket
; tới backend /api/voice/stream khi có tiếng nói.
; Flash:  pio run -t upload -e esp32dev
; Serial: pio device monitor
; WROOM-32 không có USB-CDC riêng -> Serial ra UART0 bình thường, không cần
; -DARDUINO_USB_CDC_ON_BOOT (khác S2 Mini).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ; WebSocket client nhị phân (RFC6455) để stream PCM tới backend ASR
    links2004/WebSockets@^2.7.3
    ; MQTT client: subscribe home/room/presence (từ radar-node) + home/room/ac_cmd để bắn IR
    256dpi/MQTT@^2.5
    ; Điều khiển điều hoà Daikin bằng giao thức có sẵn (không cần học mã, không cần TSOP)
    crankyoldgit/IRremoteESP8266@^2.8.6
; ArduinoOTA + Update nằm sẵn trong core ESP32, không cần khai lib_deps.

build_flags =
    ; CHỈ biên dịch Daikin. Mặc định IRremoteESP8266 kéo vào hàng trăm giao thức của mọi
    ; hãng — thừa vài chục KB flash mà không bao giờ dùng. Board này đã ở 75% flash.
    -D_IR_ENABLE_DEFAULT_=false
    -DSEND_DAIKIN=true
    -DSEND_DAIKIN152=true

; Nạp qua WiFi — dùng khi board ĐÃ chạy firmware có OTA (phải nạp USB 1 lần đầu để kích hoạt).
;   pio run -e esp32dev_ota -t upload
; Giữ env esp32dev ở trên làm ĐƯỜNG LUI: bản nào làm chết WiFi thì OTA bó tay.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = voice-node.local    ; đổi thành IP nếu mDNS không phân giải được
upload_flags =
    ; Mật khẩu đọc từ biến môi trường — KHÔNG ghi vào file này (platformio.ini nằm trong git).
    ;   export OTA_PASSWORD='...'   (phải khớp OTA_PASSWORD trong include/config.h)
    --auth=${sysenv.OTA_PASSWORD}

; ── ESP32-S3-DevKitC-1 N16R8 (16MB flash, 8MB PSRAM octal, ăng-ten IPEX) ─────────
; Thay cho WROOM-32. Env esp32dev ở trên giữ nguyên làm đường lui khi quay lại WROOM.
;   pio run -e esp32s3 -t upload
;
; Ba chân I2S BẮT BUỘC đổi vì bản đồ GPIO của S3 khác hẳn ESP32 gốc:
;   GPIO22-25 không tồn tại · GPIO26-32 là bus SPI flash · GPIO33-37 bị PSRAM octal chiếm
; Cả 26/25/34 đang dùng đều rơi vào vùng cấm. Chân 5/6/7 nằm ngoài mọi vùng đó và an
; toàn trên mọi biến thể S3. GPIO4 của IR không phải đổi.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = ${env:esp32dev.lib_deps}

; Board trong platform khai theo bản N8 (8MB, không PSRAM) — khai lại cho khớp N16R8.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; CẮM VÀO CỔNG "TTL", KHÔNG PHẢI "OTG". Board S3-CAM có hai cổng USB-C:
;   TTL → chip CH340 → UART0 (GPIO43/44).  OTG → USB native của S3 (GPIO19/20).
; Chọn TTL vì USB native TỰ ENUMERATE LẠI mỗi lần reset — đó chính là nguyên nhân của
; bẫy "lần flash đầu luôn fail, phải chạy lại lần 2" đã gặp với S2 Mini. Qua CH340 thì
; auto-reset DTR/RTS chạy bình thường.
; Vì đi UART0 nên KHÔNG đặt -DARDUINO_USB_CDC_ON_BOOT=1: đặt vào là Serial nhảy sang
; cổng OTG và màn hình serial ở cổng TTL trống trơn.
build_flags =
    ${env:esp32dev.build_flags}
    ; I2S: 5/6/7 nằm ngoài vùng flash (26-32), PSRAM octal (35-37) và strapping
    ; (0, 3, 45, 46). Trên board CAM chúng kiêm chân camera — vô hại khi không gắn camera.
    -DCFG_I2S_SCK=5
    -DCFG_I2S_WS=6
    -DCFG_I2S_SD=7
    ; IR sang GPIO8: GPIO4-7 trên board S3-CAM nằm ở header camera, chân sát nhau nên hàn tay khó.
    ; GPIO8 ở hàng GPIO thường, thoáng hơn. Không phải strapping, không thuộc bus flash/PSRAM.
    -DCFG_IR_PIN=8
    ; KHÔNG ghi đè CFG_I2S_CHAN: mặc định ONLY_RIGHT trong main.cpp đã đúng cho board này.
    ; Đã thử ONLY_LEFT ngày 30/07 và đo được RMS = 0.0 tuyệt đối (có pulldown chân SD nên số 0
    ; này đáng tin) => mic KHÔNG lái nửa trái. Đừng thử lại hướng đó.
