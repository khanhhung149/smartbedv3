; ESP32-CAM node — AI-Thinker (OV2640) + VL53L0X (ToF, bus I2C RIÊNG — không chung
; SCCB camera, xem Wiring dưới). Thay cụm "Camera nhiệt / MLX90614" gốc của Phase 01 —
; mục tiêu thật là quan sát hành vi lúc ngủ, KHÔNG phải đo nhiệt. Quyết định đầy đủ:
;   plans/260813-0934-esp32cam-vl53l0x-camera-node/
;
; framework = espidf THUẦN (không arduino, không mix) — theo tiền lệ đã chạy thật ở
; esp32-presence-ac/firmware/voice-node/ (project riêng của Hưng). Managed component
; espressif/esp32-camera khai trong idf_component.yml, không dùng Arduino camera lib.
;
; Flash:  pio run -t upload -e esp32cam
; Serial: pio device monitor
;
; Wiring (AI-Thinker chuẩn, xác nhận thật 13/08 — xem plan.md Bench Bring-up Log):
;   Camera SCCB (nội bộ, KHÔNG ra header)  -> SIOD=GPIO26  SIOC=GPIO27
;   VL53L0X (bus I2C RIÊNG, port 0)        -> SDA=GPIO4    SCL=GPIO13
;     KHÔNG dùng GPIO12 (bootstrap MTDI, rủi ro không boot) hay GPIO16 (PSRAM CS).
;     Địa chỉ I2C VL53L0X: 0x29 (mặc định).
;   SD (SDMMC 1-bit)                       -> CLK=GPIO14   CMD=GPIO15   D0=GPIO2
;
; ⚠️ Nguồn RIÊNG 5V/2A cho board này — KHÔNG lấy từ laptop/Jetson (quy tắc phần cứng
; chuẩn dự án, xem docs/safety/hazard-analysis.md H-20). Camera + ghi SD đồng thời
; kéo dòng đỉnh cao hơn ESP32 thường lúc idle.
;
; BENCH_TEST_MODE=1 (env mặc định) BẬT đường ghi SD + WiFi/NTP lúc boot (WiFi tắt lại
; ngay trước khi vào vòng ghi chính thức — xem src/main.cpp). Build production PHẢI
; dùng env esp32cam_production_check (BENCH_TEST_MODE=0): không còn code path nào ghi
; ảnh ra đĩa hay bật WiFi — đúng 5 nguyên tắc riêng tư Phase 05
; (docs/safety/hazard-analysis.md H-25).

[env:esp32cam]
; Ghim version cụ thể — KHÔNG để mặc định resolve mới nhất. Bài học từ
; esp32-presence-ac/firmware/voice-node/platformio.ini (dòng 90-103): framework = espidf
; thuần là trường hợp rủi ro cao nhất cho version drift (Espressif ghép Arduino/IDF khác
; nhau tuỳ bản platform). 55.3.311 là version đã build SUCCESS thật (esp32cam-node, 13/08).
platform = espressif32@55.3.311
board = esp32cam
framework = espidf
monitor_speed = 115200
; Board mặc định nạp ở 460800 baud — bắt được "Serial data stream stopped: possible
; noise" thật lúc bring-up (13/08), sau khi thêm dây VL53L0X gần đường UART. Giảm tốc
; độ nạp chống nhiễu, đáng tin cậy hơn trên kết nối USB-TTL không hoàn hảo.
upload_speed = 115200
build_flags =
    -DBENCH_TEST_MODE=1

; Build kiểm tra "production" — dùng để verify Phase 4 Success Criteria
; (không link được hàm ghi SD/WiFi nào). Không phải env để flash cho khách hàng thật —
; node này CHƯA có kế hoạch sản xuất, chỉ dùng để verify ranh giới bench-test.
[env:esp32cam_production_check]
extends = env:esp32cam
build_flags =
    -DBENCH_TEST_MODE=0
