
; PlatformIO Project Configuration
; Sleep Pad ESP32 — BLE provisioning + MQTT telemetry

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
; ESP32-C3 Super Mini uses native USB CDC (no UART bridge)
upload_protocol = esptool
upload_speed = 460800
; 1200bps touch triggers CDC bootloader reset automatically
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Library dependencies
; ESP32 BLE is built into the Arduino gframework — no extra lib needed
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.1
    knolleary/PubSubClient @ ^2.8

; Serial monitor speed
monitor_speed = 115200

; Mock build — synthesizes sleep-pad telemetry so the pipeline can be
; smoke-tested with just an ESP32 on the bench (no physical sleep pad).
; See firmware/src/mock-sleeppad.* and plans/260422-0140-firmware-sleep-pad-mock/.
; Flash via:  pio run -e esp32dev-mock -t upload -t monitor
[env:esp32dev-mock]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DMOCK_SLEEPPAD=1
