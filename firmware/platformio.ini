; PlatformIO Project Configuration
; Sleep Pad ESP32 — BLE provisioning + MQTT telemetry

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv

; Library dependencies
; ESP32 BLE is built into the Arduino framework — no extra lib needed
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.1
    knolleary/PubSubClient @ ^2.8

; Serial monitor speed
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Mock build — synthesizes sleep-pad telemetry so the pipeline can be
; smoke-tested with just an ESP32 on the bench (no physical sleep pad).
; See firmware/src/mock-sleeppad.* and plans/260422-0140-firmware-sleep-pad-mock/.
; Flash via:  pio run -e esp32dev-mock -t upload -t monitor
[env:esp32dev-mock]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DMOCK_SLEEPPAD=1
