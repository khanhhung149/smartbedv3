; PlatformIO Project Configuration
; Sleep Pad ESP32 — BLE provisioning + MQTT telemetry

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv

; Library dependencies
; ESP32 BLE + esp_mqtt_client (with WSS + esp_crt_bundle) are built into
; the arduino-esp32 framework — no extra MQTT or TLS lib needed.
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.1

; Serial monitor speed
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Mock build — synthesizes sleep-pad telemetry so the pipeline can be
; smoke-tested with just an ESP32 on the bench (no physical sleep pad).
; See firmware/src/mock-sleeppad.* and plans/260422-0140-firmware-sleep-pad-mock/.
; Flash via:  pio run -e esp32dev-mock -t upload -t monitor
[env:esp32dev-mock]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DMOCK_SLEEPPAD=1

; ESP32-C3 Super Mini (RISC-V, native USB-C CDC, BLE 5.0, WiFi 2.4 GHz).
; UART pins remap to GPIO 20/21 via CONFIG_IDF_TARGET_ESP32C3 in config.h.
; ARDUINO_USB_CDC_ON_BOOT=1 routes Serial.* to the USB-C port (no UART chip).
[env:c3supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.1
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3supermini-mock]
extends = env:c3supermini
build_flags = ${env:c3supermini.build_flags} -DMOCK_SLEEPPAD=1
