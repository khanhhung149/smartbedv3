name: Sleep Pad iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "app/sleep-pad/**"
      - ".github/workflows/ios-sleep-pad.yml"

jobs:
  ios-debug-build:
    name: Flutter iOS debug build (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/sleep-pad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build iOS app (unsigned)
        run: >-
          flutter build ios --debug --no-codesign --no-pub
          -t lib/main/main_dev.dart
          --dart-define=DEV_API_BASE_URL=http://192.168.1.120:8000
          --dart-define=DEV_WS_BASE_URL=ws://192.168.1.120:8000

      - name: Archive unsigned app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/sleep-pad-ios-debug-unsigned.zip

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleep-pad-ios-debug-unsigned
          path: app/sleep-pad/build/sleep-pad-ios-debug-unsigned.zip

